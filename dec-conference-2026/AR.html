<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Storybook AR: Caterpillar & Brown Bear</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Comic Sans MS", "Chalkboard SE", sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Live Camera Background */
    #camera-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      display: none;
    }

    /* Fallback Storybook Room Background when camera is off */
    #fallback-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 40%, #fffdf5 0%, #e2ebd5 70%, #b8d4a7 100%);
      z-index: 1;
    }

    /* Floor shadow grid in preview mode */
    #ar-reticle-hint {
      position: absolute;
      bottom: 24%;
      left: 50%;
      transform: translateX(-50%) rotateX(70deg);
      width: 220px;
      height: 220px;
      border: 4px dashed rgba(76, 175, 80, 0.45);
      border-radius: 50%;
      z-index: 2;
      pointer-events: none;
    }

    /* 3D WebGL Canvas */
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      touch-action: none;
    }

    /* Top Header Overlay */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .character-switcher {
      display: flex;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 5px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      pointer-events: auto;
    }

    .char-btn {
      border: none;
      background: transparent;
      padding: 8px 14px;
      border-radius: 25px;
      font-weight: 800;
      font-size: 14px;
      color: #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .char-btn.active {
      background: #4CAF50;
      color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .char-btn.bear.active {
      background: #8D5524;
    }

    /* Story Speech Bubble */
    #speech-bubble {
      position: absolute;
      top: 78px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      color: #222;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 15px;
      text-align: center;
      max-width: 88vw;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      border: 3px solid #4CAF50;
      z-index: 10;
      pointer-events: none;
      transition: all 0.25s ease;
    }

    /* Bottom Control Dock */
    .bottom-dock {
      position: absolute;
      bottom: 20px;
      left: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #222;
    }

    .action-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 16px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s;
      flex: 1;
      min-width: 120px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-camera {
      background: #0071e3;
      color: white;
    }

    .btn-interact {
      background: #ff6b6b;
      color: white;
    }

    .btn-native-ar {
      background: #222222;
      color: white;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: bold;
      padding: 0 6px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: #4CAF50;
    }
  </style>

  <!-- Import Three.js and USDZExporter for Native iPhone AR Quick Look -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Live iOS Camera Video Feed -->
  <video id="camera-feed" autoplay playsinline muted></video>
  <div id="fallback-bg"></div>
  <div id="ar-reticle-hint"></div>

  <!-- 3D AR Overlay Canvas -->
  <canvas id="ar-canvas"></canvas>

  <!-- Top Controls: Character Switcher -->
  <div class="top-bar">
    <div class="character-switcher">
      <button class="char-btn active" id="btn-caterpillar">🐛 Hungry Caterpillar</button>
      <button class="char-btn bear" id="btn-bear">🐻 Brown Bear</button>
    </div>
  </div>

  <!-- Story Prompt Bubble -->
  <div id="speech-bubble">
    Drag to rotate in 3D! Tap "Feed Apple" or launch AR camera.
  </div>

  <!-- Bottom Control Panel -->
  <div class="bottom-dock">
    <div class="slider-row">
      <span>📏 AR Size</span>
      <input type="range" id="scale-slider" min="0.5" max="2.0" step="0.05" value="1.0">
    </div>

    <div class="action-row">
      <button class="btn btn-camera" id="toggle-camera-btn">📷 Start Live AR Camera</button>
      <button class="btn btn-interact" id="interact-btn">🍎 Feed Apple</button>
      <button class="btn btn-native-ar" id="native-ar-btn">📦 iOS Quick Look AR</button>
    </div>
  </div>

  <!-- Hidden anchor required by iOS Safari to trigger native AR Quick Look -->
  <a id="ar-quick-look-link" rel="ar" style="display:none;">
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="ar">
  </a>

  <script type="module">
    import * as THREE from 'three';
    import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';

    // --- SPEECH SYNTHESIS HELPER ---
    function speakLine(text, pitch = 1.1, rate = 0.95) {
      const bubble = document.getElementById('speech-bubble');
      bubble.innerText = text;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.pitch = pitch;
        utter.rate = rate;
        window.speechSynthesis.speak(utter);
      }
    }

    // --- THREE.JS SCENE SETUP ---
    const canvas = document.getElementById('ar-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.4, 5.2);
    camera.lookAt(0, 0.2, 0);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.1);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff8e7, 1.6);
    dirLight.position.set(3, 6, 4);
    scene.add(dirLight);

    // Root container for active character
    const mainGroup = new THREE.Group();
    scene.add(mainGroup);

    // --- BUILD THE VERY HUNGRY CATERPILLAR ---
    const caterpillarGroup = new THREE.Group();
    const bodySegments = [];

    function buildCaterpillar() {
      const greens = [0x2e7d32, 0x43a047, 0x66bb6a, 0x388e3c, 0x81c784, 0x4caf50];

      // Segmented Green Body
      for (let i = 0; i < 6; i++) {
        const segGeo = new THREE.SphereGeometry(0.38 - (i * 0.015), 24, 24);
        segGeo.scale(0.85, 1.05, 1.0);
        const segMat = new THREE.MeshStandardMaterial({
          color: greens[i % greens.length],
          roughness: 0.55,
          metalness: 0.05
        });
        const seg = new THREE.Mesh(segGeo, segMat);
        seg.position.set(0.35 - (i * 0.36), Math.sin(i * 0.8) * 0.12, 0);

        // Little brown feet
        const footGeo = new THREE.CapsuleGeometry(0.05, 0.12, 8, 8);
        const footMat = new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.8 });
        const leftFoot = new THREE.Mesh(footGeo, footMat);
        leftFoot.position.set(0, -0.36, 0.14);
        const rightFoot = new THREE.Mesh(footGeo, footMat);
        rightFoot.position.set(0, -0.36, -0.14);
        seg.add(leftFoot, rightFoot);

        caterpillarGroup.add(seg);
        bodySegments.push(seg);
      }

      // Red Head
      const headGeo = new THREE.SphereGeometry(0.44, 28, 28);
      headGeo.scale(0.9, 1.1, 1.0);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xe53935, roughness: 0.45 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.set(0.82, 0.12, 0);

      // Big Yellow & Green Eyes
      const eyeOuterGeo = new THREE.SphereGeometry(0.13, 16, 16);
      eyeOuterGeo.scale(0.5, 1.2, 0.9);
      const yellowMat = new THREE.MeshStandardMaterial({ color: 0xfdd835, roughness: 0.3 });
      const greenEyeMat = new THREE.MeshStandardMaterial({ color: 0x1b5e20, roughness: 0.3 });

      [-0.16, 0.16].forEach(zPos => {
        const eyeYellow = new THREE.Mesh(eyeOuterGeo, yellowMat);
        eyeYellow.position.set(0.35, 0.1, zPos);

        const pupilGeo = new THREE.SphereGeometry(0.08, 14, 14);
        pupilGeo.scale(0.6, 1.2, 0.9);
        const eyeGreen = new THREE.Mesh(pupilGeo, greenEyeMat);
        eyeGreen.position.set(0.04, 0, 0);
        eyeYellow.add(eyeGreen);
        head.add(eyeYellow);
      });

      // Purple Antennae
      const antGeo = new THREE.CapsuleGeometry(0.035, 0.28, 8, 8);
      const antMat = new THREE.MeshStandardMaterial({ color: 0x6a1b9a, roughness: 0.6 });
      const leftAnt = new THREE.Mesh(antGeo, antMat);
      leftAnt.position.set(0.15, 0.52, 0.15);
      leftAnt.rotation.z = -0.3;
      leftAnt.rotation.x = 0.25;

      const rightAnt = new THREE.Mesh(antGeo, antMat);
      rightAnt.position.set(0.15, 0.52, -0.15);
      rightAnt.rotation.z = -0.3;
      rightAnt.rotation.x = -0.25;

      head.add(leftAnt, rightAnt);
      caterpillarGroup.add(head);
      bodySegments.unshift(head);

      // Floating Red Apple to snack on
      const appleGroup = new THREE.Group();
      const appleGeo = new THREE.SphereGeometry(0.22, 20, 20);
      const appleMat = new THREE.MeshStandardMaterial({ color: 0xd32f2f, roughness: 0.35 });
      const appleMesh = new THREE.Mesh(appleGeo, appleMat);
      const stemGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.12);
      const stemMat = new THREE.MeshStandardMaterial({ color: 0x4e342e });
      const stem = new THREE.Mesh(stemGeo, stemMat);
      stem.position.y = 0.22;
      appleGroup.add(appleMesh, stem);
      appleGroup.position.set(1.45, 0.05, 0);
      appleGroup.name = "snackApple";
      caterpillarGroup.add(appleGroup);
    }

    // --- BUILD BROWN BEAR ---
    const bearGroup = new THREE.Group();

    function buildBrownBear() {
      const furMat = new THREE.MeshStandardMaterial({ color: 0x794022, roughness: 0.75 });
      const snoutMat = new THREE.MeshStandardMaterial({ color: 0xa66e4e, roughness: 0.65 });
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4 });
      const eyeYellowMat = new THREE.MeshStandardMaterial({ color: 0xffe082, roughness: 0.3 });

      // Bear Torso
      const bodyGeo = new THREE.SphereGeometry(0.65, 28, 28);
      bodyGeo.scale(1.35, 1.0, 0.95);
      const torso = new THREE.Mesh(bodyGeo, furMat);
      torso.position.set(-0.2, 0, 0);
      bearGroup.add(torso);

      // Bear Head
      const headGeo = new THREE.SphereGeometry(0.46, 26, 26);
      const head = new THREE.Mesh(headGeo, furMat);
      head.position.set(0.68, 0.32, 0);

      // Snout
      const snoutGeo = new THREE.SphereGeometry(0.24, 20, 20);
      snoutGeo.scale(1.2, 0.85, 0.9);
      const snout = new THREE.Mesh(snoutGeo, snoutMat);
      snout.position.set(0.35, -0.06, 0);

      // Nose
      const noseGeo = new THREE.SphereGeometry(0.08, 14, 14);
      const nose = new THREE.Mesh(noseGeo, darkMat);
      nose.position.set(0.24, 0.05, 0);
      snout.add(nose);
      head.add(snout);

      // Round Ears
      const earGeo = new THREE.SphereGeometry(0.15, 16, 16);
      [-0.28, 0.28].forEach(z => {
        const ear = new THREE.Mesh(earGeo, furMat);
        ear.position.set(-0.05, 0.38, z);
        head.add(ear);
      });

      // Eyes
      const eyeGeo = new THREE.SphereGeometry(0.075, 14, 14);
      const pupilGeo = new THREE.SphereGeometry(0.045, 12, 12);
      [-0.2, 0.2].forEach(z => {
        const eye = new THREE.Mesh(eyeGeo, eyeYellowMat);
        eye.position.set(0.36, 0.12, z);
        const pupil = new THREE.Mesh(pupilGeo, darkMat);
        pupil.position.set(0.05, 0, 0);
        eye.add(pupil);
        head.add(eye);
      });

      bearGroup.add(head);

      // Four Sturdy Legs
      const legGeo = new THREE.CapsuleGeometry(0.17, 0.45, 12, 12);
      const legPositions = [
        [0.25, -0.52, 0.3],
        [0.25, -0.52, -0.3],
        [-0.6, -0.52, 0.3],
        [-0.6, -0.52, -0.3]
      ];
      legPositions.forEach(([x, y, z]) => {
        const leg = new THREE.Mesh(legGeo, furMat);
        leg.position.set(x, y, z);
        bearGroup.add(leg);
      });
    }

    buildCaterpillar();
    buildBrownBear();
    mainGroup.add(caterpillarGroup);

    // --- INTERACTION & STATE ---
    let currentCharacter = 'caterpillar';
    let munchTime = 0;
    let bearColorIndex = 0;
    const bearStoryFriends = [
      { name: "Brown Bear", color: 0x794022, line: "Brown Bear, Brown Bear, what do you see?" },
      { name: "Red Bird", color: 0xd32f2f, line: "I see a Red Bird looking at me!" },
      { name: "Yellow Duck", color: 0xfbc02d, line: "I see a Yellow Duck looking at me!" },
      { name: "Blue Horse", color: 0x1976d2, line: "I see a Blue Horse looking at me!" },
      { name: "Green Frog", color: 0x388e3c, line: "I see a Green Frog looking at me!" },
      { name: "Purple Cat", color: 0x7b1fa2, line: "I see a Purple Cat looking at me!" }
    ];

    const btnCaterpillar = document.getElementById('btn-caterpillar');
    const btnBear = document.getElementById('btn-bear');
    const interactBtn = document.getElementById('interact-btn');
    const speechBubble = document.getElementById('speech-bubble');

    btnCaterpillar.addEventListener('click', () => {
      currentCharacter = 'caterpillar';
      btnCaterpillar.classList.add('active');
      btnBear.classList.remove('active');
      speechBubble.style.borderColor = '#4CAF50';
      mainGroup.clear();
      mainGroup.add(caterpillarGroup);
      interactBtn.innerHTML = '🍎 Feed Apple';
      speakLine("In the light of the moon, a little egg lay on a leaf...", 1.15);
    });

    btnBear.addEventListener('click', () => {
      currentCharacter = 'bear';
      btnBear.classList.add('active');
      btnCaterpillar.classList.remove('active');
      speechBubble.style.borderColor = '#8D5524';
      mainGroup.clear();
      mainGroup.add(bearGroup);
      interactBtn.innerHTML = '🎨 What Do You See?';
      speakLine("Brown Bear, Brown Bear, what do you see?", 0.85);
    });

    // Character Action Button
    const caterpillarSnacks = [
      { emoji: "🍎", color: 0xd32f2f, text: "On Monday he ate through one apple. Nom nom nom!" },
      { emoji: "🍐", color: 0xafb42b, text: "On Tuesday he ate through two pears. Still hungry!" },
      { emoji: "🫐", color: 0x512da8, text: "On Wednesday he ate through three plums!" },
      { emoji: "🍓", color: 0xc2185b, text: "On Thursday he ate through four strawberries!" },
      { emoji: "🍊", color: 0xf57c00, text: "On Friday he ate through five oranges! Yummy!" },
      { emoji: "🍃", color: 0x2e7d32, text: "He ate through one nice green leaf, and felt much better!" }
    ];
    let snackIdx = 0;

    interactBtn.addEventListener('click', () => {
      if (currentCharacter === 'caterpillar') {
        const snack = caterpillarSnacks[snackIdx % caterpillarSnacks.length];
        snackIdx++;
        munchTime = 45; // Trigger rapid wiggle & chomp
        const appleObj = caterpillarGroup.getObjectByName("snackApple");
        if (appleObj) {
          appleObj.children[0].material.color.setHex(snack.color);
        }
        // Grow caterpillar slightly on each snack
        const nextScale = Math.min(1.6, mainGroup.scale.x + 0.06);
        mainGroup.scale.set(nextScale, nextScale, nextScale);
        document.getElementById('scale-slider').value = nextScale;
        speakLine(snack.text, 1.2);
      } else {
        bearColorIndex = (bearColorIndex + 1) % bearStoryFriends.length;
        const friend = bearStoryFriends[bearColorIndex];
        bearGroup.children[0].material.color.setHex(friend.color);
        speakLine(friend.line, 0.85);
      }
    });

    // Scale Slider
    document.getElementById('scale-slider').addEventListener('input', (e) => {
      const s = parseFloat(e.target.value);
      mainGroup.scale.set(s, s, s);
    });

    // --- TOUCH / DRAG TO ROTATE 3D CHARACTER ---
    let isDragging = false;
    let prevX = 0;
    let prevY = 0;

    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      prevX = e.clientX;
      prevY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - prevX;
      const dy = e.clientY - prevY;
      mainGroup.rotation.y += dx * 0.012;
      mainGroup.rotation.x = Math.max(-0.6, Math.min(0.6, mainGroup.rotation.x + dy * 0.008));
      prevX = e.clientX;
      prevY = e.clientY;
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });

    // --- LIVE IPHONE CAMERA AR STREAM ---
    const videoEl = document.getElementById('camera-feed');
    const fallbackBg = document.getElementById('fallback-bg');
    const cameraBtn = document.getElementById('toggle-camera-btn');
    let cameraActive = false;
    let streamRef = null;

    cameraBtn.addEventListener('click', async () => {
      if (!cameraActive) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("iOS Safari requires an HTTPS connection (https://) to open the live camera.");
          return;
        }
        try {
          streamRef = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false
          });
          videoEl.srcObject = streamRef;
          videoEl.style.display = 'block';
          fallbackBg.style.display = 'none';
          cameraActive = true;
          cameraBtn.innerText = '🛑 Stop Camera';
          speakLine("Point your iPhone at a table or floor!", 1.05);
        } catch (err) {
          alert("Camera access failed: " + err.message + ". Make sure you are on HTTPS and granted camera permissions.");
        }
      } else {
        if (streamRef) {
          streamRef.getTracks().forEach(t => t.stop());
        }
        videoEl.style.display = 'none';
        fallbackBg.style.display = 'block';
        cameraActive = false;
        cameraBtn.innerText = '📷 Start Live AR Camera';
      }
    });

    // --- DYNAMICALLY GENERATE .USDZ FOR NATIVE IOS SAFARI AR QUICK LOOK ---
    const nativeArBtn = document.getElementById('native-ar-btn');
    nativeArBtn.addEventListener('click', async () => {
      try {
        nativeArBtn.innerText = '⏳ Building AR...';
        const exporter = new USDZExporter();
        const targetModel = currentCharacter === 'caterpillar' ? caterpillarGroup : bearGroup;
        const arraybuffer = await exporter.parse(targetModel);
        const blob = new Blob([arraybuffer], { type: 'model/vnd.usdz+zip' });
        const url = URL.createObjectURL(blob);

        const arAnchor = document.getElementById('ar-quick-look-link');
        arAnchor.href = url;
        arAnchor.click();
        nativeArBtn.innerText = '📦 iOS Quick Look AR';
      } catch (err) {
        nativeArBtn.innerText = '📦 iOS Quick Look AR';
        alert("Could not launch native USDZ Quick Look: " + err.message);
      }
    });

    // --- ANIMATION LOOP ---
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      if (currentCharacter === 'caterpillar') {
        const speed = munchTime > 0 ? 14 : 3.5;
        const amp = munchTime > 0 ? 0.22 : 0.1;
        if (munchTime > 0) munchTime--;

        bodySegments.forEach((seg, idx) => {
          seg.position.y = Math.sin(t * speed - idx * 0.7) * amp + (idx === 0 ? 0.12 : 0);
        });
      } else {
        // Gentle breathing and bobbing for Brown Bear
        bearGroup.position.y = Math.sin(t * 2.5) * 0.06;
        bearGroup.rotation.z = Math.sin(t * 1.8) * 0.04;
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
