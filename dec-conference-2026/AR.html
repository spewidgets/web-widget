<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Storybook AR: Place & Play</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Comic Sans MS", "Chalkboard SE", sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      position: fixed;
    }

    /* Live iPhone Camera Feed */
    #camera-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      display: none;
    }

    /* Fallback Storybook Room Background */
    #fallback-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 35%, #fffdf5 0%, #dcebd2 65%, #a7c993 100%);
      z-index: 1;
    }

    /* 3D WebGL Canvas */
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      touch-action: none;
    }

    /* Top Bar with iPhone Safe Area Support */
    .top-bar {
      position: absolute;
      top: calc(env(safe-area-inset-top, 12px) + 10px);
      left: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .character-switcher {
      display: flex;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      padding: 4px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.22);
      pointer-events: auto;
    }

    .char-btn {
      border: none;
      background: transparent;
      padding: 8px 14px;
      border-radius: 25px;
      font-weight: 800;
      font-size: 13px;
      color: #333;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .char-btn.active {
      background: #4CAF50;
      color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .char-btn.bear.active {
      background: #8D5524;
    }

    .status-pill {
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 20px;
      pointer-events: auto;
    }

    /* Story Speech Bubble */
    #speech-bubble {
      position: absolute;
      top: calc(env(safe-area-inset-top, 12px) + 64px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      color: #222;
      padding: 10px 16px;
      border-radius: 18px;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
      width: 90vw;
      max-width: 420px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      border: 3px solid #4CAF50;
      z-index: 10;
      pointer-events: none;
    }

    /* Bottom Control Dock with iPhone Home Bar Safe Area */
    .bottom-dock {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 12px) + 10px);
      left: 14px;
      right: 14px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 12px 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.28);
      display: flex;
      flex-direction: column;
      gap: 9px;
      color: #222;
    }

    .action-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 11px 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: transform 0.1s, opacity 0.2s;
      flex: 1;
      min-width: 105px;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-camera {
      background: #0071e3;
      color: white;
    }

    .btn-place {
      background: #2e7d32;
      color: white;
    }

    .btn-place.locked {
      background: #f57c00;
    }

    .btn-interact {
      background: #ff6b6b;
      color: white;
    }

    /* Native iOS Quick Look Anchor Styled as Button */
    .btn-native-ar {
      background: #222222;
      color: white;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: bold;
      padding: 0 4px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: #4CAF50;
    }
  </style>

  <!-- Three.js and USDZExporter -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Live iPhone Camera Video -->
  <video id="camera-feed" autoplay playsinline webkit-playsinline muted></video>
  <div id="fallback-bg"></div>

  <!-- 3D WebGL Canvas -->
  <canvas id="ar-canvas"></canvas>

  <!-- Top Controls -->
  <div class="top-bar">
    <div class="character-switcher">
      <button class="char-btn active" id="btn-caterpillar">🐛 Caterpillar</button>
      <button class="char-btn bear" id="btn-bear">🐻 Brown Bear</button>
    </div>
    <div class="status-pill" id="ar-status">🎯 Aiming Mode</div>
  </div>

  <!-- Story Prompt Bubble -->
  <div id="speech-bubble">
    Tap "Start AR Camera", aim at your floor or table, and tap "Place Here"!
  </div>

  <!-- Bottom Control Panel -->
  <div class="bottom-dock">
    <div class="slider-row">
      <span>📏 Size</span>
      <input type="range" id="scale-slider" min="0.4" max="2.0" step="0.05" value="0.9">
      <span>🔄 Spin</span>
      <input type="range" id="rot-slider" min="-3.14" max="3.14" step="0.05" value="0">
    </div>

    <div class="action-row">
      <button class="btn btn-camera" id="toggle-camera-btn">📷 Start AR Camera</button>
      <button class="btn btn-place" id="place-btn">📌 Place Here</button>
      <button class="btn btn-interact" id="interact-btn">🍎 Feed Snack</button>
    </div>

    <div class="action-row">
      <!-- Direct <a rel="ar"> link with required child <img> for iOS Safari Quick Look -->
      <a id="native-ar-link" rel="ar" download="storybook-character.usdz" class="btn btn-native-ar">
        <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" style="width:1px;height:1px;position:absolute;opacity:0;">
        📦 Launch Native iOS Surface AR (Quick Look)
      </a>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';

    // --- SPEECH SYNTHESIS ---
    function speakLine(text, pitch = 1.1, rate = 0.95) {
      const bubble = document.getElementById('speech-bubble');
      bubble.innerText = text;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.pitch = pitch;
        utter.rate = rate;
        window.speechSynthesis.speak(utter);
      }
    }

    // --- THREE.JS SCENE & CAMERA ---
    const canvas = document.getElementById('ar-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    // Camera positioned at average handheld height looking slightly down at table/floor
    camera.position.set(0, 1.6, 4.5);
    camera.lookAt(0, 0, 0);

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const dirLight = new THREE.DirectionalLight(0xfff8e7, 1.7);
    dirLight.position.set(4, 8, 5);
    scene.add(dirLight);

    // Invisible Floor Plane for Tap-to-Place Raycasting
    const floorPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    floorPlane.rotation.x = -Math.PI / 2;
    floorPlane.position.y = -0.65;
    scene.add(floorPlane);

    // Target Placement Ring (Reticle on Floor)
    const reticleGroup = new THREE.Group();
    const ringGeo = new THREE.RingGeometry(0.85, 1.0, 36);
    ringGeo.rotateX(-Math.PI / 2);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x4caf50,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.75
    });
    const reticleMesh = new THREE.Mesh(ringGeo, ringMat);
    reticleGroup.add(reticleMesh);
    reticleGroup.position.set(0, -0.64, 0);
    scene.add(reticleGroup);

    // World Anchor Group (Holds the character in 3D space)
    const worldAnchor = new THREE.Group();
    worldAnchor.scale.set(0.9, 0.9, 0.9);
    scene.add(worldAnchor);

    // Helper to create USDZ-compatible rounded cylinders (replaces CapsuleGeometry)
    function createRoundedLimb(radius, length, material) {
      const group = new THREE.Group();
      const cyl = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 16), material);
      const topCap = new THREE.Mesh(new THREE.SphereGeometry(radius, 16, 12), material);
      topCap.position.y = length / 2;
      const botCap = new THREE.Mesh(new THREE.SphereGeometry(radius, 16, 12), material);
      botCap.position.y = -length / 2;
      group.add(cyl, topCap, botCap);
      return group;
    }

    // --- 1. BUILD THE VERY HUNGRY CATERPILLAR ---
    const caterpillarGroup = new THREE.Group();
    const bodySegments = [];
    let snackGroup = new THREE.Group();

    function buildCaterpillar() {
      const greens = [0x2e7d32, 0x43a047, 0x66bb6a, 0x388e3c, 0x81c784, 0x4caf50];
      const footMat = new THREE.MeshStandardMaterial({ color: 0x5d4037, roughness: 0.8 });

      // Segmented Green Body (shifted slightly left so the scene stays balanced with the food gap)
      for (let i = 0; i < 6; i++) {
        const segGeo = new THREE.SphereGeometry(0.38 - (i * 0.015), 24, 24);
        segGeo.scale(0.85, 1.05, 1.0);
        const segMat = new THREE.MeshStandardMaterial({
          color: greens[i % greens.length],
          roughness: 0.55,
          metalness: 0.05
        });
        const seg = new THREE.Mesh(segGeo, segMat);
        seg.position.set(0.05 - (i * 0.36), Math.sin(i * 0.8) * 0.12, 0);

        // Little brown feet (USDZ-safe cylinders)
        const leftFoot = createRoundedLimb(0.05, 0.12, footMat);
        leftFoot.position.set(0, -0.36, 0.14);
        const rightFoot = createRoundedLimb(0.05, 0.12, footMat);
        rightFoot.position.set(0, -0.36, -0.14);
        seg.add(leftFoot, rightFoot);

        caterpillarGroup.add(seg);
        bodySegments.push(seg);
      }

      // Red Head at x = 0.52
      const headGeo = new THREE.SphereGeometry(0.44, 28, 28);
      headGeo.scale(0.9, 1.1, 1.0);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xe53935, roughness: 0.45 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.set(0.52, 0.12, 0);

      // Big Yellow & Green Eyes
      const eyeOuterGeo = new THREE.SphereGeometry(0.13, 16, 16);
      eyeOuterGeo.scale(0.5, 1.2, 0.9);
      const yellowMat = new THREE.MeshStandardMaterial({ color: 0xfdd835, roughness: 0.3 });
      const greenEyeMat = new THREE.MeshStandardMaterial({ color: 0x1b5e20, roughness: 0.3 });

      [-0.16, 0.16].forEach(zPos => {
        const eyeYellow = new THREE.Mesh(eyeOuterGeo, yellowMat);
        eyeYellow.position.set(0.35, 0.1, zPos);

        const pupilGeo = new THREE.SphereGeometry(0.08, 14, 14);
        pupilGeo.scale(0.6, 1.2, 0.9);
        const eyeGreen = new THREE.Mesh(pupilGeo, greenEyeMat);
        eyeGreen.position.set(0.04, 0, 0);
        eyeYellow.add(eyeGreen);
        head.add(eyeYellow);
      });

      // Purple Antennae
      const antMat = new THREE.MeshStandardMaterial({ color: 0x6a1b9a, roughness: 0.6 });
      const leftAnt = createRoundedLimb(0.035, 0.28, antMat);
      leftAnt.position.set(0.15, 0.52, 0.15);
      leftAnt.rotation.z = -0.3;
      leftAnt.rotation.x = 0.25;

      const rightAnt = createRoundedLimb(0.035, 0.28, antMat);
      rightAnt.position.set(0.15, 0.52, -0.15);
      rightAnt.rotation.z = -0.3;
      rightAnt.rotation.x = -0.25;

      head.add(leftAnt, rightAnt);
      caterpillarGroup.add(head);
      bodySegments.unshift(head);

      // Snack Food placed with plenty of clear space in front of the head (x = 2.05 vs head at 0.52)
      const appleGeo = new THREE.SphereGeometry(0.24, 24, 24);
      const appleMat = new THREE.MeshStandardMaterial({ color: 0xd32f2f, roughness: 0.35 });
      const appleMesh = new THREE.Mesh(appleGeo, appleMat);

      const stemGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.14, 12);
      const stemMat = new THREE.MeshStandardMaterial({ color: 0x4e342e });
      const stem = new THREE.Mesh(stemGeo, stemMat);
      stem.position.y = 0.24;

      // Little green leaf on the apple stem
      const leafGeo = new THREE.SphereGeometry(0.07, 12, 12);
      leafGeo.scale(1.6, 0.4, 0.8);
      const leafMat = new THREE.MeshStandardMaterial({ color: 0x43a047 });
      const leaf = new THREE.Mesh(leafGeo, leafMat);
      leaf.position.set(0.06, 0.24, 0);

      snackGroup.add(appleMesh, stem, leaf);
      // Generous space between caterpillar head (x=0.52) and food (x=2.05)
      snackGroup.position.set(2.05, -0.15, 0);
      caterpillarGroup.add(snackGroup);
    }

    // --- 2. BUILD BROWN BEAR ---
    const bearGroup = new THREE.Group();

    function buildBrownBear() {
      const furMat = new THREE.MeshStandardMaterial({ color: 0x794022, roughness: 0.75 });
      const snoutMat = new THREE.MeshStandardMaterial({ color: 0xa66e4e, roughness: 0.65 });
      const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4 });
      const eyeYellowMat = new THREE.MeshStandardMaterial({ color: 0xffe082, roughness: 0.3 });

      const bodyGeo = new THREE.SphereGeometry(0.65, 28, 28);
      bodyGeo.scale(1.35, 1.0, 0.95);
      const torso = new THREE.Mesh(bodyGeo, furMat);
      torso.position.set(-0.15, 0.1, 0);
      bearGroup.add(torso);

      const headGeo = new THREE.SphereGeometry(0.46, 26, 26);
      const head = new THREE.Mesh(headGeo, furMat);
      head.position.set(0.73, 0.42, 0);

      const snoutGeo = new THREE.SphereGeometry(0.24, 20, 20);
      snoutGeo.scale(1.2, 0.85, 0.9);
      const snout = new THREE.Mesh(snoutGeo, snoutMat);
      snout.position.set(0.35, -0.06, 0);

      const noseGeo = new THREE.SphereGeometry(0.08, 14, 14);
      const nose = new THREE.Mesh(noseGeo, darkMat);
      nose.position.set(0.24, 0.05, 0);
      snout.add(nose);
      head.add(snout);

      const earGeo = new THREE.SphereGeometry(0.15, 16, 16);
      [-0.28, 0.28].forEach(z => {
        const ear = new THREE.Mesh(earGeo, furMat);
        ear.position.set(-0.05, 0.38, z);
        head.add(ear);
      });

      const eyeGeo = new THREE.SphereGeometry(0.075, 14, 14);
      const pupilGeo = new THREE.SphereGeometry(0.045, 12, 12);
      [-0.2, 0.2].forEach(z => {
        const eye = new THREE.Mesh(eyeGeo, eyeYellowMat);
        eye.position.set(0.36, 0.12, z);
        const pupil = new THREE.Mesh(pupilGeo, darkMat);
        pupil.position.set(0.05, 0, 0);
        eye.add(pupil);
        head.add(eye);
      });

      bearGroup.add(head);

      const legPositions = [
        [0.3, -0.42, 0.3],
        [0.3, -0.42, -0.3],
        [-0.55, -0.42, 0.3],
        [-0.55, -0.42, -0.3]
      ];
      legPositions.forEach(([x, y, z]) => {
        const leg = createRoundedLimb(0.17, 0.45, furMat);
        leg.position.set(x, y, z);
        bearGroup.add(leg);
      });
    }

    buildCaterpillar();
    buildBrownBear();
    worldAnchor.add(caterpillarGroup);

    // --- PRE-GENERATE USDZ BLOB URL SO NATIVE IOS QUICK LOOK LAUNCHES INSTANTLY ---
    const nativeArLink = document.getElementById('native-ar-link');
    const exporter = new USDZExporter();

    async function refreshUSDZLink(targetGroup, filename) {
      try {
        // Clone so export transforms stay clean
        const clone = targetGroup.clone(true);
        clone.position.set(0, 0.5, 0);
        clone.scale.set(0.25, 0.25, 0.25); // Realistic tabletop size in meters for iOS AR Quick Look
        clone.updateMatrixWorld(true);

        const arraybuffer = await exporter.parse(clone);
        const blob = new Blob([arraybuffer], { type: 'model/vnd.usdz+zip' });
        const url = URL.createObjectURL(blob);
        nativeArLink.href = url;
        nativeArLink.download = filename;
      } catch (e) {
        console.warn("USDZ pre-build error:", e);
      }
    }

    // Build initial Caterpillar USDZ immediately
    refreshUSDZLink(caterpillarGroup, 'hungry-caterpillar.usdz');

    // --- PLACEMENT & GYRO TRACKING STATE ---
    let currentCharacter = 'caterpillar';
    let isPlaced = false;
    let placedWorldPos = new THREE.Vector3(0, 0, 0);
    let gyroEnabled = false;
    let baseAlpha = null, baseBeta = null, baseGamma = null;
    let currentRotX = 0, currentRotY = 0;

    const placeBtn = document.getElementById('place-btn');
    const statusPill = document.getElementById('ar-status');

    function setPlacedState(placed, customPos = null) {
      isPlaced = placed;
      if (customPos) {
        placedWorldPos.copy(customPos);
      }
      if (isPlaced) {
        worldAnchor.position.copy(placedWorldPos);
        reticleGroup.visible = false;
        placeBtn.innerText = '🔓 Move / Unpin';
        placeBtn.classList.add('locked');
        statusPill.innerText = '📌 Locked in Space';
        speakLine("Character locked in place! Tilt your iPhone or tap the floor to move it.", 1.05);
      } else {
        placedWorldPos.set(0, 0, 0);
        worldAnchor.position.set(0, 0, 0);
        reticleGroup.visible = true;
        reticleGroup.position.set(0, -0.64, 0);
        placeBtn.innerText = '📌 Place Here';
        placeBtn.classList.remove('locked');
        statusPill.innerText = '🎯 Aiming Mode';
      }
    }

    placeBtn.addEventListener('click', () => {
      setPlacedState(!isPlaced, worldAnchor.position.clone());
    });

    // Tap anywhere on the floor/screen to place the character at that spot
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObject(floorPlane);
      if (hits.length > 0) {
        const hitPoint = hits[0].point;
        // Clamp range so character stays comfortably visible
        hitPoint.x = Math.max(-2.2, Math.min(2.2, hitPoint.x));
        hitPoint.z = Math.max(-2.5, Math.min(1.5, hitPoint.z));
        hitPoint.y = 0;
        reticleGroup.position.set(hitPoint.x, -0.64, hitPoint.z);
        setPlacedState(true, hitPoint);
      }
    });

    // Enable iOS DeviceOrientation Gyroscope so tilting the phone moves the camera around the placed object
    async function enableGyroscope() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const response = await DeviceOrientationEvent.requestPermission();
          if (response === 'granted') {
            window.addEventListener('deviceorientation', onDeviceOrientation);
            gyroEnabled = true;
          }
        } catch (e) {
          console.warn("Gyro permission skipped:", e);
        }
      } else if ('DeviceOrientationEvent' in window) {
        window.addEventListener('deviceorientation', onDeviceOrientation);
        gyroEnabled = true;
      }
    }

    function onDeviceOrientation(e) {
      if (!isPlaced || e.beta === null || e.gamma === null) return;
      if (baseBeta === null) {
        baseBeta = e.beta;
        baseGamma = e.gamma;
      }
      const dBeta = (e.beta - baseBeta) * 0.035;
      const dGamma = (e.gamma - baseGamma) * 0.035;

      // Offset camera smoothly as user tilts iPhone so placed model stays anchored in the room
      camera.position.x = THREE.MathUtils.clamp(-dGamma, -2.5, 2.5);
      camera.position.y = THREE.MathUtils.clamp(1.6 + dBeta, 0.5, 3.2);
      camera.lookAt(placedWorldPos.x, placedWorldPos.y, placedWorldPos.z);
    }

    // --- CHARACTER SWITCHER & STORY INTERACTION ---
    const btnCaterpillar = document.getElementById('btn-caterpillar');
    const btnBear = document.getElementById('btn-bear');
    const interactBtn = document.getElementById('interact-btn');
    const speechBubble = document.getElementById('speech-bubble');

    btnCaterpillar.addEventListener('click', () => {
      currentCharacter = 'caterpillar';
      btnCaterpillar.classList.add('active');
      btnBear.classList.remove('active');
      speechBubble.style.borderColor = '#4CAF50';
      worldAnchor.clear();
      worldAnchor.add(caterpillarGroup);
      interactBtn.innerHTML = '🍎 Feed Snack';
      refreshUSDZLink(caterpillarGroup, 'hungry-caterpillar.usdz');
      speakLine("In the light of the moon, a little egg lay on a leaf...", 1.15);
    });

    btnBear.addEventListener('click', () => {
      currentCharacter = 'bear';
      btnBear.classList.add('active');
      btnCaterpillar.classList.remove('active');
      speechBubble.style.borderColor = '#8D5524';
      worldAnchor.clear();
      worldAnchor.add(bearGroup);
      interactBtn.innerHTML = '🎨 What Do You See?';
      refreshUSDZLink(bearGroup, 'brown-bear.usdz');
      speakLine("Brown Bear, Brown Bear, what do you see?", 0.85);
    });

    const caterpillarSnacks = [
      { color: 0xd32f2f, text: "On Monday he ate through one apple. Nom nom nom!" },
      { color: 0xafb42b, text: "On Tuesday he ate through two pears. Still hungry!" },
      { color: 0x512da8, text: "On Wednesday he ate through three plums!" },
      { color: 0xc2185b, text: "On Thursday he ate through four strawberries!" },
      { color: 0xf57c00, text: "On Friday he ate through five oranges! Yummy!" },
      { color: 0x2e7d32, text: "He ate through one nice green leaf, and felt much better!" }
    ];
    let snackIdx = 0;
    let munchTime = 0;

    const bearStoryFriends = [
      { color: 0x794022, line: "Brown Bear, Brown Bear, what do you see?" },
      { color: 0xd32f2f, line: "I see a Red Bird looking at me!" },
      { color: 0xfbc02d, line: "I see a Yellow Duck looking at me!" },
      { color: 0x1976d2, line: "I see a Blue Horse looking at me!" },
      { color: 0x388e3c, line: "I see a Green Frog looking at me!" },
      { color: 0x7b1fa2, line: "I see a Purple Cat looking at me!" }
    ];
    let bearColorIndex = 0;

    interactBtn.addEventListener('click', () => {
      if (currentCharacter === 'caterpillar') {
        const snack = caterpillarSnacks[snackIdx % caterpillarSnacks.length];
        snackIdx++;
        munchTime = 50;
        snackGroup.children[0].material.color.setHex(snack.color);
        speakLine(snack.text, 1.2);
        refreshUSDZLink(caterpillarGroup, 'hungry-caterpillar.usdz');
      } else {
        bearColorIndex = (bearColorIndex + 1) % bearStoryFriends.length;
        const friend = bearStoryFriends[bearColorIndex];
        bearGroup.children[0].material.color.setHex(friend.color);
        speakLine(friend.line, 0.85);
        refreshUSDZLink(bearGroup, 'brown-bear.usdz');
      }
    });

    // Size & Rotation Sliders
    document.getElementById('scale-slider').addEventListener('input', (e) => {
      const s = parseFloat(e.target.value);
      worldAnchor.scale.set(s, s, s);
    });

    document.getElementById('rot-slider').addEventListener('input', (e) => {
      worldAnchor.rotation.y = parseFloat(e.target.value);
    });

    // --- LIVE IPHONE CAMERA STREAM + GYRO ACTIVATION ---
    const videoEl = document.getElementById('camera-feed');
    const fallbackBg = document.getElementById('fallback-bg');
    const cameraBtn = document.getElementById('toggle-camera-btn');
    let cameraActive = false;
    let streamRef = null;

    cameraBtn.addEventListener('click', async () => {
      if (!cameraActive) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("ERROR: iPhone Camera requires an HTTPS (https://) link.");
          return;
        }
        try {
          // Request Gyroscope & Rear Camera together on user tap
          await enableGyroscope();
          streamRef = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false
          });
          videoEl.srcObject = streamRef;
          videoEl.style.display = 'block';
          fallbackBg.style.display = 'none';
          cameraActive = true;
          cameraBtn.innerText = '🛑 Stop Camera';
          speakLine("Camera active! Tap anywhere on your floor or table to lock the character there.", 1.05);
        } catch (err) {
          alert("Camera error: " + err.message + ". Ensure HTTPS and Safari Camera permissions are enabled.");
        }
      } else {
        if (streamRef) streamRef.getTracks().forEach(t => t.stop());
        videoEl.style.display = 'none';
        fallbackBg.style.display = 'block';
        cameraActive = false;
        cameraBtn.innerText = '📷 Start AR Camera';
      }
    });

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      if (currentCharacter === 'caterpillar') {
        const speed = munchTime > 0 ? 14 : 3.2;
        const amp = munchTime > 0 ? 0.2 : 0.08;

        if (munchTime > 0) {
          munchTime--;
          // Animate the food hopping across the gap toward the mouth while chewing, then returning to x = 2.05
          const progress = Math.sin((1 - munchTime / 50) * Math.PI);
          snackGroup.position.x = 2.05 - progress * 0.85;
          snackGroup.position.y = -0.15 + Math.abs(Math.sin(t * 12)) * 0.22;
        } else {
          // Keep food floating at a comfortable distance (x = 2.05) in front of the head (x = 0.52)
          snackGroup.position.x = 2.05;
          snackGroup.position.y = -0.15 + Math.sin(t * 2.5) * 0.05;
        }

        bodySegments.forEach((seg, idx) => {
          seg.position.y = Math.sin(t * speed - idx * 0.7) * amp + (idx === 0 ? 0.12 : 0);
        });
      } else {
        bearGroup.position.y = Math.sin(t * 2.4) * 0.05;
        bearGroup.rotation.z = Math.sin(t * 1.6) * 0.03;
      }

      // Pulse the target placement ring when in Aiming Mode
      if (!isPlaced) {
        const pulse = 1 + Math.sin(t * 4) * 0.06;
        reticleMesh.scale.set(pulse, pulse, pulse);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
